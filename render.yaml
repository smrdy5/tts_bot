services:
  - type: web
    name: voxcpm-telegram-bot
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: TELEGRAM_TOKEN
        sync: false
      - key: PIXAZO_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: voxcpm-db
          property: connectionString

databases:
  - name: voxcpm-db
    region: singapore
    plan: free
